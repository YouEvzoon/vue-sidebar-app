  <body>
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('theme-dark')
          const dark = saved === null ? true : JSON.parse(saved)
          document.body.classList.toggle('light-theme', !dark)
        } catch (e) {
          document.body.classList.remove('light-theme')
        }
      })()
    </script>
    <div id="app"></div>
  </body>
</html>
